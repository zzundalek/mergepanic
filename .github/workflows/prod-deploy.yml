name: Prod deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: main

env:
  JWT_SECRET: EMPTY-ONLY_NEEDED_FOR_BUILD
  GOOGLE_CLIENT_ID: EMPTY-ONLY_NEEDED_FOR_BUILD  
  SERVER_URL: http://empty-only_needed_for_build
  ENV: prod

jobs:
  deploy:
    name: Prod Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Build step
        run: "deno task build"

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "mergepanic.com"
          entrypoint: "./main.ts"
